name: uninafoodlab

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: ${UNINAFOODLAB_DB_NAME:?UNINAFOODLAB_DB_NAME is required}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}
      UNINAFOODLAB_DB_MIGRATOR_PASSWORD: ${UNINAFOODLAB_DB_MIGRATOR_PASSWORD:?UNINAFOODLAB_DB_MIGRATOR_PASSWORD is required}
      UNINAFOODLAB_DB_PASSWORD: ${UNINAFOODLAB_DB_PASSWORD:?UNINAFOODLAB_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:${UNINAFOODLAB_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=postgres --dbname=$${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./database/bootstrap/docker-entrypoint.sh:/docker-entrypoint-initdb.d/010-uninafoodlab-roles.sh:ro
      - ./database/bootstrap/001__create_roles.sql:/opt/uninafoodlab/bootstrap/001__create_roles.sql:ro

volumes:
  postgres-data:
